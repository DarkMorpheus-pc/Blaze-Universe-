[package]
name = "audit"
version = "4.0.2"
release = 1
architecture = "x86_64"
summary = "User space tools for Linux Kernel 2.6+ audit subsystem"
license = "GPL-2.0-or-later"
maintainer = "BlazeOS Core Team <core@blazeos.org>"
url = "https://github.com/linux-audit/audit-userspace"

[source]
url = "https://github.com/linux-audit/audit-userspace/archive/refs/tags/v4.0.2.tar.gz"
sha256 = "642cea2699e961ed2e9c25543f08cf7cc8165b60dae6b9f36a01ae96cc45ff38"

[dependencies]
requires = ["glibc >= 2.38"]
provides = [
    "audit = 4.0.2",
    "cmd:auditctl",
    "cmd:aureport",
    "cmd:ausearch",
    "cmd:autrace",
    "lib:libaudit.so.1",
    "lib:libauparse.so.0"
]

[build]
script = """
# Fix upstream automake subdir-objects collision where auparse/Makefile.am
# compiles ../lib/gen_flagtabs_h-gen_tables.o with ../auparse/flagtab.h,
# clobbering lib/gen_flagtabs_h-gen_tables.o and breaking audit_name_to_flag("exit").
cp lib/gen_tables.c lib/gen_tables.h auparse/
sed -i 's|\\../lib/gen_tables\\.c|gen_tables.c|g; s|\\../lib/gen_tables\\.h|gen_tables.h|g' auparse/Makefile.am

./autogen.sh
./configure --prefix=/usr \
            --sysconfdir=/etc \
            --sbindir=/usr/bin \
            --runstatedir=/run \
            --disable-static \
            --without-python \
            --without-python3 \
            --without-golang
make -j$(nproc)
make DESTDIR="$DESTDIR" install
# Fix augenrules blank line when no -e directive is present and PIDFile path
sed -i 's|printf "%s\\\\n", minus_e;|if (minus_e != "") printf "%s\\\\n", minus_e;|' "$DESTDIR/usr/bin/augenrules"
sed -i 's|/sbin/auditctl|/usr/bin/auditctl|g' "$DESTDIR/usr/bin/augenrules"
if [ -f "$DESTDIR/usr/lib/systemd/system/auditd.service" ]; then
    sed -i 's|PIDFile=/usr/var/run/auditd.pid|PIDFile=/run/auditd.pid|g' "$DESTDIR/usr/lib/systemd/system/auditd.service"
fi
"""

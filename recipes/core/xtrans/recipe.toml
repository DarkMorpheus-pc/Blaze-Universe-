[package]
name = "xtrans"
version = "1.5.0"
release = 1
architecture = "noarch"
summary = "X Network Transport layer shared code"
license = "MIT"
maintainer = "BlazeOS Core Team <core@blazeos.org>"
url = "https://x.org"

[source]
url = "https://xorg.freedesktop.org/archive/individual/lib/xtrans-1.5.0.tar.xz"
sha256 = "1ba4b703696bfddbf40bacf25bce4e3efb2a0088878f017a50e9884b0c8fb1bd"

[dependencies]
provides = ["xtrans = 1.5.0"]

[build]
script = """
./configure --prefix=/usr --sysconfdir=/etc
make -j$(nproc)
make DESTDIR="$DESTDIR" install
"""

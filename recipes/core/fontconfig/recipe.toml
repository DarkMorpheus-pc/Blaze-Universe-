[package]
name = "fontconfig"
version = "2.15.0"
release = 2
architecture = "x86_64"
summary = "A library for configuring and customizing font access"
license = "HPND"
maintainer = "BlazeOS Core Team <core@blazeos.org>"
url = "https://www.freedesktop.org/wiki/Software/fontconfig/"

[source]
url = "https://gitlab.freedesktop.org/fontconfig/fontconfig/-/archive/2.15.0/fontconfig-2.15.0.tar.gz"
sha256 = "cdebb4b805d33e9bdefcc0ef9743db638d2acb21139bbe1a6a85878d4c3e8c9e"

[dependencies]
requires = ["freetype >= 2.13.0", "glibc >= 2.38"]
provides = [
    "fontconfig = 2.15.0",
    "cmd:fc-cache",
    "cmd:fc-cat",
    "cmd:fc-list",
    "cmd:fc-match",
    "cmd:fc-query",
    "cmd:fc-scan",
    "lib:libfontconfig.so.1"
]

[build]
script = """
meson setup build \
    --prefix=/usr \
    --sysconfdir=/etc \
    --localstatedir=/var \
    --buildtype=release \
    -Ddoc=disabled \
    -Dtests=disabled
ninja -C build
DESTDIR="$DESTDIR" ninja -C build install
"""

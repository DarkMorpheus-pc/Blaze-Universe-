[package]
name = "coreutils"
version = "9.4"
release = 1
architecture = "x86_64"
summary = "The GNU Core Utilities (Complete Suite)"
description = "Essential core utilities for BlazeOS Native."
license = "GPL-3.0-or-later"
maintainer = "BlazeOS Core Team <core@blazeos.org>"
url = "https://www.gnu.org/software/coreutils/"

[dependencies]
requires = ["glibc = 2.44"]
provides = [
    "coreutils = 9.4",
    "cmd:echo",
    "cmd:cat",
    "cmd:ls",
    "cmd:cp",
    "cmd:mv",
    "cmd:rm",
    "cmd:mkdir",
    "cmd:chmod",
    "cmd:chown",
    "cmd:uname",
    "cmd:date",
    "cmd:touch",
    "cmd:head",
    "cmd:tail",
    "cmd:sort",
    "cmd:uniq",
    "cmd:wc",
    "cmd:tr",
    "cmd:tee",
    "cmd:env",
    "cmd:install",
    "cmd:nproc",
    "cmd:expr",
    "cmd:basename",
    "cmd:dirname"
]

[build]
script = """
cp -a "$CURRENT_DIR/build/coreutils_work/dest/"* "$DESTDIR/"
"""

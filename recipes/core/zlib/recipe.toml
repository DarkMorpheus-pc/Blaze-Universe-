[package]
name = "zlib"
version = "1.3.1"
release = 1
architecture = "x86_64"
summary = "Compression and decompression library"
license = "Zlib"
maintainer = "BlazeOS Core Team <core@blazeos.org>"
url = "https://zlib.net/"

[dependencies]
provides = ["zlib = 1.3.1", "lib:libz.so.1"]

[build]
script = """
cp -a "$CURRENT_DIR/build/m2_work/zlib-dest/"* "$DESTDIR/"
"""

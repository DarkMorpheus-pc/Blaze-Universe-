[package]
name = "zlib"
version = "1.3.1"
release = 1
architecture = "x86_64"
summary = "Compression and decompression library"
description = "Lossless data-compression library for BlazeOS Native."
license = "Zlib"
maintainer = "BlazeOS Core Team <core@blazeos.org>"
url = "https://zlib.net/"

[source]
url = "https://zlib.net/fossils/zlib-1.3.1.tar.gz"
sha256 = "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23"
filename = "zlib-1.3.1.tar.gz"

[dependencies]
provides = [
    "zlib = 1.3.1",
    "lib:libz.so.1",
    "lib:libz.so"
]

[triggers]
run_ldconfig = true

[build]
script = """
./configure --prefix=/usr
make -j$(nproc)
make DESTDIR="$DESTDIR" install
"""

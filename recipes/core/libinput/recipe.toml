[package]
name = "libinput"
version = "1.32.0"
release = 1
architecture = "x86_64"
summary = "Input device management and event handling library"
license = "MIT"
maintainer = "BlazeOS Core Team <core@blazeos.org>"
url = "https://gitlab.freedesktop.org/libinput/libinput"

[source]
url = "https://gitlab.freedesktop.org/libinput/libinput/-/archive/1.32.0/libinput-1.32.0.tar.gz"
sha256 = "7dd6c1ca964c86eb6810ccd6639cda634e68bdca43bf3afec39e94e942fac8d4"

[dependencies]
requires = ["glibc >= 2.38"]
provides = [
    "libinput = 1.32.0",
    "cmd:libinput",
    "lib:libinput.so.10"
]

[build]
script = """
meson setup build \
    --prefix=/usr \
    --sysconfdir=/etc \
    --buildtype=release \
    -Ddocumentation=false \
    -Dtests=false \
    -Ddebug-gui=false
ninja -C build
DESTDIR="$DESTDIR" ninja -C build install
"""

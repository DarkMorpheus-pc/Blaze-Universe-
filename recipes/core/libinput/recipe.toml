[package]
name = "libinput"
version = "1.26.2"
release = 1
architecture = "x86_64"
summary = "Input device management and event handling library"
license = "MIT"
maintainer = "BlazeOS Core Team <core@blazeos.org>"
url = "https://gitlab.freedesktop.org/libinput/libinput"

[source]
url = "https://gitlab.freedesktop.org/libinput/libinput/-/archive/1.26.2/libinput-1.26.2.tar.gz"
sha256 = "5c1c4150f217fea1db2d1fd88e2607b2f1928cfde65c34da65a9f24dcfd69464"

[dependencies]
requires = ["glibc >= 2.38"]
provides = [
    "libinput = 1.26.2",
    "cmd:libinput",
    "lib:libinput.so.10"
]

[build]
script = """
meson setup build \
    --prefix=/usr \
    --sysconfdir=/etc \
    --buildtype=release \
    -Ddocumentation=false \
    -Dtests=false \
    -Ddebug-gui=false
ninja -C build
DESTDIR="$DESTDIR" ninja -C build install
"""

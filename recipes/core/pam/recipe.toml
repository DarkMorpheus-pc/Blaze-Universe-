[package]
name = "pam"
version = "1.6.1"
release = 2
architecture = "x86_64"
summary = "Pluggable Authentication Modules for Linux"
license = "BSD-3-Clause OR GPL-2.0-only"
maintainer = "BlazeOS Core Team <core@blazeos.org>"
url = "https://github.com/linux-pam/linux-pam"

[dependencies]
provides = [
    "pam = 1.6.1",
    "lib:libpam.so.0",
    "lib:libpam_misc.so.0",
    "lib:libpamc.so.0"
]

[build]
script = """
cp -a "$CURRENT_DIR/build/m2_work/pam-dest/"* "$DESTDIR/"
if [ -f "$DESTDIR/usr/bin/unix_chkpwd" ]; then
    chmod 4755 "$DESTDIR/usr/bin/unix_chkpwd"
fi
cat << 'EOF' > "$DESTDIR/etc/pam.d/su"
#%PAM-1.0
auth       sufficient   pam_rootok.so
auth       required     pam_unix.so
account    required     pam_unix.so
password   required     pam_unix.so sha512 shadow
session    required     pam_unix.so
EOF
cp "$DESTDIR/etc/pam.d/su" "$DESTDIR/etc/pam.d/su-l"
"""

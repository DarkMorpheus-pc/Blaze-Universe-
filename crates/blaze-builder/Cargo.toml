[package]
name = "blaze-builder"
version = "0.1.0"
edition = "2021"
authors = ["BlazeOS Core Team <core@blazeos.org>"]
description = "Deterministic package builder and recipe compiler for BlazeOS Native"

[dependencies]
portadora-core = { path = "../portadora-core" }
clap = { workspace = true }
serde = { workspace = true }

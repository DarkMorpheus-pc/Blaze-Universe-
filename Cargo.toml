[workspace]
members = [
    "crates/portadora-core",
    "crates/portadora",
    "crates/blaze-builder",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
tar = "0.4"
zstd = "0.13"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4.5", features = ["derive", "cargo"] }
anyhow = "1.0"
thiserror = "1.0"
goblin = "0.8"
walkdir = "2.5"
tempfile = "3.10"
reqwest = { version = "0.12", features = ["blocking"] }
flate2 = "1.0"
xz2 = "0.1"
bzip2 = "0.4"
